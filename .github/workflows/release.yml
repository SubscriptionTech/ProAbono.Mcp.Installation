# Publishes @proabono/mcp-installation to npm when a `v*` tag is pushed. The tag is the trigger:
# nothing else starts a release.
#
# Two permissions, two distinct jobs:
#   - `id-token: write` is what produces the provenance attestation. Without it the publish still
#     succeeds and the Provenance panel simply never appears on npmjs.com.
#   - `contents: write` is what lets the last step create the GitHub release object. A tag travels
#     with a clone; a release does not.
#
# Authentication is a granular npm automation token, scoped to this package, held as the NPM_TOKEN
# secret. Provenance does not come from it -- it comes from `id-token: write` above -- so rotating
# the token never costs the attestation.
#
# A published version number is spent: npm refuses to republish it, even after an unpublish. The
# version guard below runs before anything is uploaded, so a tag that disagrees with package.json
# fails the run instead of burning the version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the declared version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${declared}"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # `prepublishOnly` rebuilds and re-tests; the steps above are what names the failing stage
      # when something breaks.
      - name: Publish to npm, with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
