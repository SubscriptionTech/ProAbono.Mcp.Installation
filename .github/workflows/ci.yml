# Install, build, type-check and test on every push and pull request.
#
# A red build blocks a release -- see RELEASING.md. The live lane of the test suite is skipped here:
# it needs the fixture account's credentials, which are not available to a pull request from a fork.
#
# The job needs no credential of its own. Both sources the build vendors -- the API Live contract
# and the documentation corpus -- are committed under resources/, so a fork's pull request builds like
# any other run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The versions `engines` claims support for. Adding one here is what allows lowering it.
        node: ["20.x", "22.x", "24.x"]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # `release.yml` only ever runs on a `v*` tag, so nothing else proves its setup still works until a
  # release is already under way. This job reproduces its `setup-node` configuration on every push
  # and checks the two things trusted publishing depends on:
  #
  #   - the registry resolves to npmjs, which is what `registry-url` is there for;
  #   - npm is at least 11.5.1, the version npm requires for trusted publishing. A future
  #     `node-version` change that shipped an older npm would otherwise fail at the publish step of
  #     a real release, with the tag already pushed.
  #
  # It needs no credential of its own -- there is no token anywhere in the release path any more.
  release-path:
    name: release path
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v7
        with:
          # Kept identical to release.yml. A difference here would make this job prove nothing.
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check npm is new enough for trusted publishing
        run: |
          node -e '
            const have = process.argv[1], want = "11.5.1";
            const part = (v, i) => Number(v.split(".")[i]) || 0;
            const diff = [0, 1, 2].reduce((r, i) => r !== 0 ? r : part(have, i) - part(want, i), 0);
            if (diff < 0) {
              console.log(`::error::npm ${have} is older than the ${want} trusted publishing requires`);
              process.exit(1);
            }
            console.log(`npm ${have} satisfies >= ${want}`);
          ' "$(npm --version)"

      - name: Check setup-node resolved the npm registry
        run: |
          registry="$(npm config get registry)"
          case "$registry" in
            https://registry.npmjs.org*) ;;
            *) echo "::error::registry resolves to ${registry}, expected https://registry.npmjs.org"; exit 1 ;;
          esac
