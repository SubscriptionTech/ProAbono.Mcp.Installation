# Keeps the two dependency surfaces of this repository current: the npm tree the package is built
# from, and the actions the CI and release workflows pin.
#
# The release workflow publishes with provenance, so an action bumped here changes what the
# attestation names -- review the bump, do not merge it blind.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # A single pull request for the build chain: these move together and are checked by the
      # same `npm run typecheck && npm run build && npm test`.
      dev-dependencies:
        dependency-type: development
    ignore:
      # A TypeScript major does not belong in an automated group bump. 5.9 -> 7.0 (the typescript-go
      # rewrite) stops resolving @types/node under this tsconfig.json and the typecheck collapses on
      # every Node version -- which held the useful @types/node bump hostage in the same pull request.
      # Minors and patches still flow; a major is a migration, taken deliberately.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # @types/node is pinned to the floor `engines` declares, not to the newest runtime. Types for a
      # newer Node describe APIs that do not exist on Node 20 -- `fs/promises` `glob`, for one -- and
      # the typechecker would wave them through. A major here moves only when the supported floor
      # does, which is a decision about `engines` and the CI matrix, not a dependency bump.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
