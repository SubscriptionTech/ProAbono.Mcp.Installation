                    QuantityIncluded: 100
                    QuantityCurrent: 0
                DateUpdate: "2025-08-09T13:17:39.88Z"
                Links:
                  - rel: "self"
                    href: "/v1/Subscription/140960"
                  - rel: "insite-home"
                    href: "https://demo-eur.proabono.com/portal-auth/<crypted-query-arg>"
                  - rel: "insite-related-subscription"
