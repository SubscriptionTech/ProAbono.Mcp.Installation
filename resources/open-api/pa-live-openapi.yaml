  /v1/Quoting/Subscription/{IdSubscription}/Start:
    post:
      tags: [Quoting]
      summary: Quote a subscription start
      description: >
        Computes the amount that would be charged if the specified subscription were started or
        restarted now, without modifying it. Always returns a NextTerm object showing the
        estimated recurring cost for the following billing period.
      parameters:
        - name: IdSubscription
          in: path
          required: true
          schema:
            type: integer
          description: Internal identifier of the subscription
        - name: EnsureBillable
          in: query
          required: false
          schema:
            type: boolean
          description: If true, checks that the customer has valid payment information before computing. Returns 403 if not.
      responses:
        "200":
          description: Quote object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              example:
                IdSubscription: 140960
                AmountTotalDue: 31875
                PricingLocalized: "€ 318.75"
                DatePeriodStart: "2025-08-10T07:41:57.83Z"
                DatePeriodEnd: "2025-09-10T07:41:57.83Z"
                AmountSubtotal: 25000
                AmountTotal: 31875
                Details:
                  - IdSubscription: 140960
                    LabelLocalized: "Subscription amount"
                    AmountTotalDue: 31875
                    DatePeriodStart: "2025-08-10T07:41:57.83Z"
                    DatePeriodEnd: "2025-09-10T07:41:57.83Z"
                    AmountSubtotal: 25000
                    AmountTotal: 31875
                NextTerm:
                  IdSubscription: 140960
                  AmountTotalDue: 31875
                  PricingLocalized: "€ 318.75"
                  DatePeriodStart: "2025-09-10T07:41:57.83Z"
                  DatePeriodEnd: "2025-10-10T07:41:57.83Z"
                  AmountSubtotal: 25000
                  AmountTotal: 31875
                  Details:
                    - IdSubscription: 140960
                      LabelLocalized: "Subscription amount"
                      AmountTotalDue: 31875
                      DatePeriodStart: "2025-09-10T07:41:57.83Z"
                      DatePeriodEnd: "2025-10-10T07:41:57.83Z"
                      AmountSubtotal: 25000
                      AmountTotal: 31875
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Customer not billable or billing limits reached
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationErrors"

  /v1/Quoting/Subscription/{IdSubscription}/Upgrade:
    post:
      tags: [Quoting]
      summary: Quote a subscription upgrade
      description: >
        Computes the prorated amount due now and the new recurring cost if the specified
        subscription were upgraded to the target offer, without modifying it. Always returns
        a NextTerm object.
      parameters:
        - name: IdSubscription
          in: path
          required: true
          schema:
            type: integer
          description: Internal identifier of the subscription to upgrade
        - name: ReferenceOffer
          in: query
          required: true
          schema:
            type: string
          description: Shared identifier of the target offer
        - name: BillNow
          in: query
          required: false
          schema:
            type: boolean
          description: If true, simulates immediate billing of the upgrade. Defaults to false.
        - name: Immediate
          in: query
          required: false
          schema:
            type: boolean
          description: If false, simulates an upgrade that takes effect at end of term instead of immediately. Defaults to true.
      responses:
        "200":
          description: Quote object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              example:
                IdSubscription: 140960
                AmountTotalDue: 4971
                PricingLocalized: "49.71 €"
                DatePeriodStart: "2025-08-10T07:32:13.76Z"
                DatePeriodEnd: "2025-09-09T12:33:32.00Z"
                AmountSubtotal: 3898
                AmountTotal: 4971
                Details:
                  - IdSubscription: 140960
                    LabelLocalized: "Subscription - refund on recurring flat fee"
                    AmountTotalDue: -26089
                    DatePeriodStart: "2025-08-10T07:32:13.76Z"
                    DatePeriodEnd: "2025-09-09T12:33:30.48Z"
                    AmountSubtotal: -20463
                    AmountTotal: -26089
                  - LabelLocalized: "Subscription amount"
                    AmountTotalDue: 31060
                    DatePeriodStart: "2025-08-10T07:32:13.76Z"
                    DatePeriodEnd: "2025-09-09T12:33:32.00Z"
                    AmountSubtotal: 24361
                    AmountTotal: 31060
                NextTerm:
                  AmountTotalDue: 31875
                  PricingLocalized: "318.75 €"
                  DatePeriodStart: "2025-09-09T12:33:32.00Z"
                  DatePeriodEnd: "2025-10-09T12:33:32.00Z"
                  AmountSubtotal: 25000
                  AmountTotal: 31875
                  Details:
                    - LabelLocalized: "Subscription amount"
                      AmountTotalDue: 31875
                      DatePeriodStart: "2025-09-09T12:33:32.00Z"
                      DatePeriodEnd: "2025-10-09T12:33:32.00Z"
                      AmountSubtotal: 25000
                      AmountTotal: 31875
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Customer not billable or billing limits reached
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationErrors"

  /v1/Quoting/Usage:
    post:
      tags: [Quoting]
      summary: Quote a usage update
      description: >
        Computes the amount that would be charged for a usage update without applying it.
        Supports three variants: increment (add to current value for Consumption or Limitation
        features), absolute set (set to a specific value for Limitation features), and toggle
        (enable or disable an OnOff feature).
      parameters:
        - name: EnsureBillable
          in: query
          required: false
          schema:
            type: boolean
          description: >
            Automatically applied when the quote would generate a fee — billability is always
            checked when a charge is involved. Set to true to force the check even when no
            fee is generated. Set to false to disable the check entirely.
        - name: NextTerm
          in: query
          required: false
          schema:
            type: boolean
          description: If true, includes the estimated recurring cost for the next billing period in the response. Defaults to false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUsageRequest"
            example:
              ReferenceFeature: "feat-users"
              ReferenceCustomer: "cust-42"
              Increment: 4
              DateStamp: "2025-08-09T12:13:50.65Z"
      responses:
        "200":
          description: Quote object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              example:
                IdSubscription: 140960
                AmountTotalDue: 5038
                PricingLocalized: "€ 50.38"
                DatePeriodStart: "2025-08-09T15:58:20.73Z"
                DatePeriodEnd: "2025-08-23T12:38:55.00Z"
                AmountSubtotal: 3952
                AmountTotal: 5038
                Details:
                  - IdSubscription: 140960
                    IdFeature: 48896
                    LabelLocalized: "Feature - prorated adjustment - Active Users"
                    AmountTotalDue: 5038
                    DatePeriodStart: "2025-08-09T15:58:20.73Z"
                    DatePeriodEnd: "2025-08-23T12:38:55.00Z"
                    QuantityReported: 6
                    QuantityBilled: 4
                    AmountSubtotal: 3952
                    AmountTotal: 5038
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Customer not billable or billing limits reached
        "422":
          $ref: "#/components/responses/ValidationErrors"

  /v1/Quoting/BalanceLine:
    post:
      tags: [Quoting]
      summary: Quote a balance line creation
      description: >
        Computes the tax-inclusive amount that would result from creating a manual balance
        line, without creating it.
      parameters:
        - name: EnsureBillable
          in: query
          required: false
          schema:
            type: boolean
          description: If true, checks that the customer has valid payment information before computing. Returns 403 if not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteBalanceLineRequest"
            example:
              ReferenceCustomer: "cust-42"
              Label: "Consulting XYZ in hours"
              Amount: 50000
              Quantity: 18
      responses:
        "200":
          description: BalanceLine Quote object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceLineQuote"
              example:
                IdSegment: 69
                IdCustomer: 233700
                ReferenceSegment: "demo-eur"
                ReferenceCustomer: "cust-42"
                LabelLocalized: "Consulting XYZ in hours"
                PricingLocalized: "€ 600.00"
                Currency: "EUR"
                AmountSubtotal: 50000
                AmountTotal: 60000
                DateMove: "2025-02-19T16:15:56.38Z"
                QuantityReported: 18
                QuantityBilled: 18
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Customer not billable or billing limits reached
        "422":
          $ref: "#/components/responses/ValidationErrors"

  # ─── Balance Lines ────────────────────────────────────────────────────────

  /v1/BalanceLine:
    post:
      tags: [Balance]
      summary: Create a balance line
      parameters:
        - name: EnsureBillable
          in: query
          required: false
          schema:
            type: boolean
          description: Check whether the customer can be billed (valid payment method, no late invoices, …) before creating the line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceLineRequest"
            example:
              ReferenceCustomer: "cust-42"
              Label: "Consulting XYZ in hours"
              Amount: 50000
              Quantity: 18
              KeyCharge: "Service"
      responses:
        "201":
          description: BalanceLine object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceLine"
              example:
                IdSegment: 69
                IdCustomer: 233700
                ReferenceSegment: "demo-eur"
                ReferenceCustomer: "cust-42"
                LabelLocalized: "Consulting XYZ in hours"
                KeyCharge: "Service"
                PricingLocalized: "€600.00"
                Currency: "EUR"
                AmountSubtotal: 50000
                AmountTotal: 60000
                DateMove: "2026-06-11T09:45:04.38Z"
                QuantityReported: 18
                QuantityBilled: 18
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationErrors"

  /v1/Balance:
    get:
      tags: [Balance]
      summary: List balance lines
      parameters:
        - name: ReferenceCustomer
          in: query
          required: false
          schema:
            type: string
          description: Filter by customer
        - name: IdCustomer
          in: query
          required: false
          schema:
            type: integer
          description: Filter by customer
        - name: IdSubscription
          in: query
          required: false
          schema:
            type: integer
          description: Filter by subscription
        - name: ReferenceFeature
          in: query
          required: false
          schema:
            type: string
          description: Filter by feature — returns only lines related to that feature
        - name: Merged
          in: query
          required: false
          schema:
            type: boolean
          description: Merge similar lines (same type, same feature, …) for a more compact list
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/SizePage"
      responses:
        "200":
          description: Paginated list of balance lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceLineList"
              example:
                Page: 1
                SizePage: 10
                Count: 2
                TotalItems: 2
                DateGenerated: "2025-02-13T13:30:17.51Z"
                Computations:
                  AmountSubtotal: 89900
                  AmountTotal: 107880
                Items:
                  - IdCustomer: 233700
                    IdSegment: 69
                    IdSubscription: 140960
                    ReferenceCustomer: "cust-42"
                    ReferenceSegment: "demo-eur"
                    LabelLocalized: "Consulting XYZ in hours"
                    PricingLocalized: "€600.00"
                    AmountTotal: 60000
                    AmountSubtotal: 50000
                    Currency: "EUR"
                    DateMove: "2025-02-13T10:58:32.22Z"
                    StateMove: "Due"
                    TypeLine: "ManualDebit"
                    QuantityReported: 18
                    QuantityBilled: 18
                  - IdCustomer: 233700
                    IdSegment: 69
                    IdSubscription: 140961
                    ReferenceCustomer: "cust-42"
                    ReferenceSegment: "demo-eur"
                    LabelLocalized: "Flat fee"
                    PricingLocalized: "€478.80"
                    AmountTotal: 47880
                    AmountSubtotal: 39900
                    Currency: "EUR"
                    DatePeriodStart: "2025-02-13T10:29:56.00Z"
                    DatePeriodEnd: "2025-03-13T10:21:17.00Z"
                    StateMove: "Due"
                    TypeLine: "SubscriptionFee"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >
        HTTP Basic Auth using the agent key as username and the API key as password.
        Both keys are available in the ProAbono backoffice Integration section.

  parameters:
    Page:
      name: Page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page index (1-based)
    SizePage:
      name: SizePage
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1000
        default: 10
      description: Items per page. Use 0 to retrieve only the count

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationErrors:
      description: Validation errors
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Error"

  schemas:

    # ── Common ──────────────────────────────────────────────────────────────

    Link:
      type: object
      properties:
        rel:
          type: string
          description: Relationship type (e.g. "self", "insite-home")
        href:
          type: string
          description: URL path to the related resource
        query:
          type: string
          description: Encrypted query parameter (used for portal links)

    Metadata:
      type: object
      description: Custom key-value pairs (max 5 pairs, 450 chars per value)
      additionalProperties:
        type: string

    PaginatedList:
      type: object
      properties:
        Count:
          type: integer
          description: Number of items returned in this page
        Page:
          type: integer
          description: Current page index (1-based)
        SizePage:
          type: integer
          description: Page size used for this response
        TotalItems:
          type: integer
          description: Total number of matching items across all pages

    Error:
      type: object
      properties:
        Code:
          type: string
        Message:
          type: string
        Exception:
          type: string
          description: Only present on some 500 errors
        Target:
          type: string
          description: Identifies the field or resource at fault

    # ── CustomerAddressBilling ──────────────────────────────────────────────

    CustomerAddressBilling:
      type: object
      properties:
        Company:
          type: string
          description: Company name
          nullable: true
        FirstName:
          type: string
          description: First name
          nullable: true
        LastName:
          type: string
          description: Last name
          nullable: true
        AddressLine1:
          type: string
          description: First address line
          nullable: true
        AddressLine2:
          type: string
          description: Second address line
          nullable: true
        ZipCode:
          type: string
          description: Postal code
          nullable: true
        City:
          type: string
          description: City
          nullable: true
        Country:
          type: string
          description: Country code (ISO 3166-1 alpha-2)
          nullable: true
        Region:
          type: string
          description: Region / subdivision / state / province / department
          nullable: true
        Phone:
          type: string
          description: Phone number
          nullable: true
        TaxInformation:
          type: string
          description: Tax identifier (VAT number, GST number, etc.)
          nullable: true

    CustomerAddressBillingRequest:
      type: object
      properties:
        Company:
          type: string
          description: Company name
        FirstName:
          type: string
          description: First name
        LastName:
          type: string
          description: Last name
        AddressLine1:
          type: string
          description: First address line
        AddressLine2:
          type: string
          description: Second address line
        ZipCode:
          type: string
          description: Postal code
        City:
          type: string
          description: City
        Country:
          type: string
          description: Country code (ISO 3166-1 alpha-2)
        Region:
          type: string
          description: Region / subdivision / state / province / department
        Phone:
          type: string
          description: Phone number
        TaxInformation:
          type: string
          description: "Tax identifier (VAT number, GST number, etc.). If you are a European business adding a VAT number for another European business, the VAT number validity will be automatically verified asynchronously."

    # ── Customers ───────────────────────────────────────────────────────────

    Customer:
      type: object
      properties:
        Id:
          type: integer
        IdSegment:
          type: integer
        ReferenceCustomer:
          type: string
        ReferenceSegment:
          type: string
        Currency:
          type: string
          description: Billing currency (ISO 4217). Defined at the segment level — cannot be updated
        Name:
          type: string
        Email:
          type: string
        Language:
          type: string
          description: "ISO 639-1 2-letter code (e.g. \"en\") or locale (e.g. \"en-US\", \"fr-FR\")"
        Status:
          type: string
          enum: [Enabled, Suspended]
          description: High-level functional state (StatusCustomer)
        ReferenceAffiliation:
          type: string
          nullable: true
        DateAffiliation:
          type: string
          format: date-time
          nullable: true
        Metadata:
          $ref: "#/components/schemas/Metadata"
        Links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    CustomerList:
      allOf:
        - $ref: "#/components/schemas/PaginatedList"
        - type: object
          properties:
            Items:
              type: array
              items:
                $ref: "#/components/schemas/Customer"

    CustomerRequest:
      type: object
      properties:
        ReferenceCustomer:
          type: string
        Email:
          type: string
        Name:
          type: string
        Language:
          type: string
        ReferenceSegment:
          type: string
        ReferenceOffer:
          type: string
        ReferenceAffiliation:
          type: string
        Metadata:
          $ref: "#/components/schemas/Metadata"

    CustomerPaymentSettings:
      type: object
      properties:
        TypePayment:
          type: string
          enum:
            - Free
            - ExternalCheck
            - ExternalCash
            - ExternalBank
            - ExternalOther
            - Card
            - DirectDebit
          description: Active payment method
        ModeBilling:
          type: string
          description: Billing mode — indicates how this customer is billed
        IsGreyListed:
          type: boolean
          description: When `true`, the customer is grey-listed and cannot access payment forms
        NoteInvoice:
          type: string
          nullable: true
          description: Note appended to the bottom of all upcoming invoices
        DateNextBilling:
          type: string
          format: date-time
          nullable: true
          description: Date of the next billing (ISO 8601)

    CustomerPaymentSettingsRequest:
      type: object
      properties:
        TypePayment:
          type: string
          enum:
            - ExternalBank
            - ExternalCash
            - ExternalCheck
            - ExternalOther
          description: "Manual payment method only — one of `ExternalBank`, `ExternalCash`, `ExternalCheck`, `ExternalOther`. Automated methods (`Card`, `DirectDebit`) are managed through the payment gateway."
        ModeBilling:
          type: string
          description: Billing mode
        IsGreyListed:
          type: boolean
          description: When `true`, prevents the customer from accessing payment forms
        NoteInvoice:
          type: string
          description: Note appended to the bottom of all upcoming invoices
        DateNextBilling:
          type: string
          format: date-time
          description: Date of the next billing (ISO 8601)

    # ── Offers ──────────────────────────────────────────────────────────────

    OfferFeature:
      type: object
      properties:
        Id:
          type: integer
        ReferenceFeature:
          type: string
        IsVisible:
          type: boolean
        TitleLocalized:
          type: string
        DescriptionLocalized:
          type: string
        TypeFeature:
          type: string
          enum: [OnOff, Limitation, Consumption]
        PricingLocalized:
          type: string
          nullable: true
        Properties:
          type: string
          description: Behavioral flags, comma-separated
          nullable: true
        IsIncluded:
          type: boolean
          description: OnOff only
          nullable: true
        IsEnabled:
          type: boolean
          description: OnOff only
          nullable: true
        QuantityIncluded:
          type: integer
          description: Limitation and Consumption only
          nullable: true
        QuantityCurrent:
          type: integer
          description: Limitation and Consumption only
          nullable: true
        Metadata:
          $ref: "#/components/schemas/Metadata"

    Offer:
      type: object
      properties:
        Id:
          type: integer
        IdSegment:
          type: integer
          description: Internal identifier of the segment the offer belongs to
        ReferenceOffer:
          type: string
        ReferenceSegment:
          type: string
          description: Shared identifier of the segment the offer belongs to
        Name:
          type: string
        IsVisible:
          type: boolean
        IsPriced:
          type: boolean
          description: "`false` if the offer is always free, `true` if it has any fee or paying feature (e.g. an offer free until a threshold is reached is considered priced)"
        TitleLocalized:
          type: string
        DescriptionLocalized:
          type: string
          nullable: true
        PricingLocalized:
          type: string
          nullable: true
        Currency:
          type: string
        AmountUpFront:
          type: integer
        AmountTrial:
          type: integer
        DurationTrial:
          type: integer
        UnitTrial:
          type: string
          enum: [Day, Week, Month, Year]
        PricingSubtotal:
          type: integer
        PricingTotal:
          type: integer
        AmountRecurrence:
          type: integer
        DurationRecurrence:
          type: integer
        UnitRecurrence:
          type: string
          enum: [Day, Week, Month, Year]
        CountRecurrences:
          type: integer
          nullable: true
        CountMinRecurrences:
          type: integer
          nullable: true
        AmountTermination:
          type: integer
        Features:
          type: array
          items:
            $ref: "#/components/schemas/OfferFeature"
        Metadata:
          $ref: "#/components/schemas/Metadata"
        Links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    OfferList:
      allOf:
        - $ref: "#/components/schemas/PaginatedList"
        - type: object
          properties:
            Items:
              type: array
              items:
                $ref: "#/components/schemas/Offer"

    # ── Features ────────────────────────────────────────────────────────────

    Feature:
      type: object
      properties:
        Id:
          type: integer
        ReferenceFeature:
          type: string
        TitleLocalized:
          type: string
        DescriptionLocalized:
          type: string
          nullable: true
        TypeFeature:
          type: string
          enum: [OnOff, Limitation, Consumption]
        IsVisible:
          type: boolean
        Metadata:
          $ref: "#/components/schemas/Metadata"

    FeatureList:
      allOf:
        - $ref: "#/components/schemas/PaginatedList"
        - type: object
          properties:
            Items:
              type: array
              items:
                $ref: "#/components/schemas/Feature"

    # ── Subscriptions ───────────────────────────────────────────────────────

    SubscriptionFeature:
      type: object
      properties:
        Id:
          type: integer
        ReferenceFeature:
          type: string
        IsVisible:
          type: boolean
        TypeFeature:
          type: string
          enum: [OnOff, Limitation, Consumption]
        TitleLocalized:
          type: string
          nullable: true
        DescriptionLocalized:
          type: string
          nullable: true
        PricingLocalized:
          type: string
          nullable: true
        IsIncluded:
          type: boolean
          description: OnOff only
          nullable: true
        IsEnabled:
          type: boolean
          description: OnOff only
          nullable: true
        QuantityIncluded:
          type: integer
          description: Limitation and Consumption only
          nullable: true
        QuantityCurrent:
          type: integer
          description: Limitation and Consumption only
          nullable: true

    Subscription:
      type: object
      properties:
        Id:
          type: integer
        IdCustomer:
          type: integer
        IdSegment:
          type: integer
        IdOffer:
          type: integer
        IdCustomerBuyer:
          type: integer
          nullable: true
        ReferenceCustomer:
          type: string
        ReferenceSegment:
          type: string
          description: Shared identifier of the segment the subscription belongs to
        ReferenceOffer:
          type: string
        ReferenceCustomerBuyer:
          type: string
          nullable: true
        Status:
          type: string
          enum: [Draft, Active, Suspended, Ended, Deleted]
          description: High-level functional state (StatusSubscription)
        StateSubscription:
          type: string
          enum:
            - DraftCustomer
            - DraftAgent
            - DraftDelayedStart
            - DraftDelayedUpgrade
            - ActiveRunning
            - ActiveDelayedUpgrade
            - ActiveDelayedTermination
            - ActiveDelayedSuspension
            - SuspendedAgent
            - SuspendedNoPaymentInfo
            - SuspendedPaymentDue
            - EndedComplete
            - EndedUpgrade
            - EndedTerminated
            - Deleted
          description: Granular technical state (StateSubscription)
        StatusAfterTerm:
          type: string
          enum: [Draft, Active, Suspended, Ended, Deleted]
          nullable: true
          description: High-level functional state scheduled after term date (StatusSubscription)
        StateSubscriptionAfterTerm:
          type: string
          enum:
            - DraftCustomer
            - DraftAgent
            - DraftDelayedStart
            - DraftDelayedUpgrade
            - ActiveRunning
            - ActiveDelayedUpgrade
            - ActiveDelayedTermination
            - ActiveDelayedSuspension
            - SuspendedAgent
            - SuspendedNoPaymentInfo
            - SuspendedPaymentDue
            - EndedComplete
            - EndedUpgrade
            - EndedTerminated
            - Deleted
          nullable: true
          description: Granular technical state scheduled after term date (StateSubscription)
        Currency:
          type: string
        TitleLocalized:
          type: string
          nullable: true
        DateStart:
          type: string
          format: date-time
          nullable: true
        DatePeriodStart:
          type: string
          format: date-time
          nullable: true
          description: Start of the current billing period
        DatePeriodEnd:
          type: string
          format: date-time
          nullable: true
          description: End of the current billing period
        DateEnd:
          type: string
          format: date-time
          nullable: true
        DateTerm:
          type: string
          format: date-time
          nullable: true
          description: Scheduled termination date
        DateResetConsumption:
          type: string
          format: date-time
          nullable: true
          description: Date at which the consumption counters will be reset
        DateNextBilling:
          type: string
          format: date-time
          nullable: true
        IsTrial:
          type: boolean
          nullable: true
          description: Whether the subscription is currently in its trial period
        CountDaysTrial:
          type: integer
          nullable: true
          description: Number of trial days remaining
        IsEngaged:
          type: boolean
          nullable: true
          description: Whether the subscription is within its minimum commitment period
        IsCustomerBillable:
          type: boolean
          nullable: true
          description: Whether the customer can be billed
        IsPaymentCappingReached:
          type: boolean
          nullable: true
          description: Whether the payment capping has been reached
        AmountUpFront:
          type: integer
          nullable: true
        AmountTrial:
          type: integer
          nullable: true
        DurationTrial:
          type: integer
          nullable: true
        UnitTrial:
          type: string
          enum: [Day, Week, Month, Year]
          nullable: true
        AmountRecurrence:
          type: integer
          nullable: true
        DurationRecurrence:
          type: integer
          nullable: true
        UnitRecurrence:
          type: string
          enum: [Day, Week, Month, Year]
          nullable: true
        CountRecurrences:
          type: integer
          nullable: true
        CountMinRecurrences:
          type: integer
          nullable: true
        AmountTermination:
          type: integer
          nullable: true
        PricingSubtotal:
          type: integer
          nullable: true
        PricingTotal:
          type: integer
          nullable: true
        Features:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionFeature"
        Metadata:
          $ref: "#/components/schemas/Metadata"
        Links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        DateUpdate:
          type: string
          format: date-time

    SubscriptionList:
      allOf:
        - $ref: "#/components/schemas/PaginatedList"
        - type: object
          properties:
            Items:
              type: array
              items:
                $ref: "#/components/schemas/Subscription"

    SubscriptionFeatureRequest:
      type: object
      properties:
        ReferenceFeature:
          type: string
        QuantityCurrent:
          type: integer
        IsEnabled:
          type: boolean

    SubscriptionRequest:
      type: object
      required:
        - ReferenceOffer
        - ReferenceCustomer
      properties:
        ReferenceCustomer:
          type: string
          description: Shared identifier of the customer who receives the subscription
        IdCustomer:
          type: integer
        ReferenceOffer:
          type: string
          description: Shared identifier of the offer to subscribe to
        ReferenceCustomerBuyer:
          type: string
          description: Shared identifier of the customer who pays. Defaults to ReferenceCustomer if omitted.
        DateStart:
          type: string
          format: date-time
          description: Override the start date. Can be in the past or future.
        TitleLocalized:
          type: string
          description: Override the subscription title
        DescriptionLocalized:
          type: string
          description: Override the subscription description
        AmountUpFront:
          type: integer
          description: Override the upfront/setup fee in cents
        AmountTrial:
          type: integer
          description: Override the trial period amount in cents
        DurationTrial:
          type: integer
          description: Override the trial period duration
        UnitTrial:
          type: string
          enum: [Day, Week, Month, Year]
          description: Override the trial period time unit
        AmountRecurrence:
          type: integer
          description: Override the recurring amount in cents
        DurationRecurrence:
          type: integer
          description: Override the recurrence duration
        UnitRecurrence:
          type: string
          enum: [Day, Week, Month, Year]
          description: Override the recurrence time unit
        CountRecurrences:
          type: integer
          nullable: true
          description: Override the total number of recurrences (null = unlimited)
        CountMinRecurrences:
          type: integer
          nullable: true
          description: Override the minimum commitment recurrences
        AmountTermination:
          type: integer
          description: Override the termination fee in cents
        Discounts:
          type: array
          description: List of discount objects to apply. Each item must have a ReferenceDiscount field.
          items:
            type: object
        Features:
          type: array
          description: Feature override objects. Features not present in the offer can be added.
          items:
            $ref: "#/components/schemas/SubscriptionFeatureRequest"
        Metadata:
          $ref: "#/components/schemas/Metadata"

    SubscriptionUpdateTermDateRequest:
      type: object
      required:
        - DateTerm
      properties:
        DateTerm:
          type: string
          format: date-time

    # ── Invoices ────────────────────────────────────────────────────────────

    Invoice:
      type: object
      properties:
        Id:
          type: integer
        IdCustomer:
          type: integer
        IdSegment:
          type: integer
        ReferenceCustomer:
          type: string
        ReferenceSegment:
          type: string
        FullNumber:
          type: string
          nullable: true
          description: Absent on Draft invoices
        Currency:
          type: string
        AmountSubtotal:
          type: integer
          description: Subtotal amount in cents
        AmountTotal:
          type: integer
          description: Total amount in cents
        Status:
          type: string
          enum: [Draft, Due, Paid, Problem, Void, Uncollectible]
          description: High-level functional state (StatusInvoice)
        StateInvoice:
          type: string
          enum:
            - Draft
            - DraftCharging
            - DueAuto
            - DueOffline
            - DueToProcess
            - DuePending
            - Paid
            - PaidRefunded
            - ProblemAuto
            - ProblemOverdue
            - ProblemDisputed
            - Void
            - Uncollectible
          description: Granular technical state (StateInvoice)
        TypePayment:
          type: string
          enum:
            - Free
            - ExternalCheck
            - ExternalCash
            - ExternalBank
            - ExternalOther
            - Card
            - DirectDebit
          description: Payment method (TypePayment)
        DateIssue:
          type: string
          format: date-time
          nullable: true
        DateUpdate:
          type: string
          format: date-time
          nullable: true
          description: Date of last update (ISO 8601)
        DatePayment:
          type: string
          format: date-time
          nullable: true
        DatePaymentScheduled:
          type: string
          format: date-time
          nullable: true
          description: Date the automated payment is scheduled for (ISO 8601). Only present when StateInvoice is DueAuto.
        DatePaymentLimit:
          type: string
          format: date-time
          nullable: true
        NoteLocalized:
          type: string
          nullable: true
          description: Note printed at the bottom of the invoice PDF
        Links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    InvoiceList:
      allOf:
        - $ref: "#/components/schemas/PaginatedList"
        - type: object
          properties:
            Items:
              type: array
              items:
                $ref: "#/components/schemas/Invoice"

    BillingCustomerRequest:
      type: object
      required:
        - ReferenceCustomer
      properties:
        ReferenceCustomer:
          type: string
          description: Customer shared identifier
        EnsureBillable:
          type: boolean
          description: If `true`, forces verification of payment information even if the offer is free. Returns `403` if no payment information is registered.
        DateStart:
          type: string
          format: date-time
          description: Ignore balance lines before this date
        DateEnd:
          type: string
          format: date-time
          description: Ignore balance lines after this date
        ForceOffline:
          type: boolean
          description: If `true`, forces the invoice to be offline even for customers with automated payment (card, direct debit)
        NoteLocalized:
          type: string
          description: Note printed at the bottom of the invoice PDF, above the customer service section

    # ── Balance Lines ───────────────────────────────────────────────────────

    BalanceLine:
      type: object
      properties:
        IdCustomer:
          type: integer
        IdSegment:
          type: integer
        IdSubscription:
          type: integer
          nullable: true
          description: Related subscription internal identifier, if any
        IdFeature:
          type: integer
          nullable: true
          description: Related feature internal identifier, if any
        ReferenceCustomer:
          type: string
        ReferenceSegment:
          type: string
        ReferenceFeature:
          type: string
          nullable: true
          description: Related feature shared identifier, if any
        LabelLocalized:
          type: string
          nullable: true
          description: Label of this line, localized in the billing language
        PricingLocalized:
          type: string
          nullable: true
          description: Formatted price for display, localized in the billing language (e.g. €600.00)
        AmountTotal:
          type: integer
          description: Total line amount in cents (negative = credit)
        AmountSubtotal:
          type: integer
          description: Subtotal line amount in cents (negative = credit, before tax)
        Currency:
          type: string
          description: Billing currency (ISO 4217). Defined at the segment level — cannot be updated
        DateMove:
          type: string
          format: date-time
          nullable: true
          description: Value date of the debit or credit, for a punctual entry (mutually exclusive with DatePeriodStart/DatePeriodEnd)
        DatePeriodStart:
          type: string
          format: date-time
          nullable: true
          description: Period start of the debit or credit, for a period-related entry such as a subscription fee (mutually exclusive with DateMove)
        DatePeriodEnd:
          type: string
          format: date-time
          nullable: true
          description: Period end of the debit or credit, for a period-related entry such as a subscription fee (mutually exclusive with DateMove)
        StateMove:
          type: string
          enum: [Due, Adjustment, Billed, Credited, Unpaid, Cancelled, Deleted]
          description: State of the balance line (StateMove)
        TypeLine:
          type: string
          enum:
            - AutoBillingReport
            - AutoBillingNoRepayment
            - AutoRefundPartial
            - AutoSubscriptionRecurrence
            - AutoSubscriptionRecurrenceProrata
            - AutoSubscriptionUpfront
            - AutoSubscriptionTrial
            - AutoSubscriptionTrialProrata
            - AutoSubscriptionTermination
            - AutoFeatureNotProratable
            - AutoFeatureProratable
            - AutoFeatureProrata
            - AutoDiscountRecurrenceFlat
            - AutoDiscountRecurrencePercent
            - AutoDiscountUpfrontFlat
            - AutoDiscountUpfrontPercent
            - AutoDiscountFeatureFlat
            - AutoDiscountFeaturePercent
            - Manual
            - ManualDiscount
            - ManualMergeable
            - CustomerReferral
            - CreditRefund
            - CreditPromotion
          description: Type of the balance line entry (TypeLine)
        KeyCharge:
          type: string
          nullable: true
          description: Related charge, indicating the nature of the product/service/fee and used to calculate the tax
        QuantityReported:
          type: integer
          nullable: true
          description: Quantity reported to the customer — informational, displayed on the invoice
        QuantityBilled:
          type: integer
          nullable: true
          description: Quantity billed to the customer — displayed on the future invoice

    BalanceLineList:
      allOf:
        - $ref: "#/components/schemas/PaginatedList"
        - type: object
          properties:
            Computations:
              type: object
              description: Calculated amounts for the given query parameters
              properties:
                AmountSubtotal:
                  type: integer
                  description: Sum of subtotal amounts across all matching lines
                AmountTotal:
                  type: integer
                  description: Sum of total amounts across all matching lines
            Items:
              type: array
              items:
                $ref: "#/components/schemas/BalanceLine"

    BalanceLineRequest:
      type: object
      required:
        - ReferenceCustomer
        - Amount
      properties:
        ReferenceCustomer:
          type: string
        IdSubscription:
          type: integer
          description: Related subscription internal identifier
        Amount:
          type: integer
          description: Line amount in cents (negative = credit)
        TypeLine:
          type: string
          enum:
            - AutoBillingReport
            - AutoBillingNoRepayment
            - AutoRefundPartial
            - AutoSubscriptionRecurrence
            - AutoSubscriptionRecurrenceProrata
            - AutoSubscriptionUpfront
            - AutoSubscriptionTrial
            - AutoSubscriptionTrialProrata
            - AutoSubscriptionTermination
            - AutoFeatureNotProratable
            - AutoFeatureProratable
            - AutoFeatureProrata
            - AutoDiscountRecurrenceFlat
            - AutoDiscountRecurrencePercent
            - AutoDiscountUpfrontFlat
            - AutoDiscountUpfrontPercent
            - AutoDiscountFeatureFlat
            - AutoDiscountFeaturePercent
            - Manual
            - ManualDiscount
            - ManualMergeable
            - CustomerReferral
            - CreditRefund
            - CreditPromotion
          description: Type of the balance line entry (TypeLine)
        KeyCharge:
          type: string
          description: Related charge, indicating the nature of the product/service/fee and used to calculate the tax
        Label:
          type: string
          description: Label of the line
        Quantity:
          type: integer
          description: Quantity
        Date:
          type: string
          format: date-time
          description: Value date of the debit or credit, for a punctual entry (mutually exclusive with DatePeriodStart/DatePeriodEnd)
        DatePeriodStart:
          type: string
          format: date-time
          description: Period start of the debit or credit, for a period-related entry (mutually exclusive with Date)
        DatePeriodEnd:
          type: string
          format: date-time
          description: Period end of the debit or credit, for a period-related entry (mutually exclusive with Date)

    # ── Usage ───────────────────────────────────────────────────────────────

    Usage:
      type: object
      properties:
        IdSegment:
          type: integer
        IdFeature:
          type: integer
        IdCustomer:
          type: integer
        IdSubscription:
          type: integer
        ReferenceSegment:
          type: string
        ReferenceFeature:
          type: string
        ReferenceCustomer:
          type: string
        TypeFeature:
          type: string
          enum: [OnOff, Limitation, Consumption]
        IsIncluded:
          type: boolean
          description: OnOff only
          nullable: true
        IsEnabled:
          type: boolean
          description: OnOff only
          nullable: true
        QuantityIncluded:
          type: integer
          description: Limitation and Consumption only
          nullable: true
        QuantityCurrent:
          type: integer
          description: Limitation and Consumption only
          nullable: true
        DatePeriodStart:
          type: string
          format: date-time
        DatePeriodEnd:
          type: string
          format: date-time

    UsageRequest:
      type: object
      required:
        - ReferenceFeature
        - DateStamp
      properties:
        ReferenceFeature:
          type: string
        ReferenceCustomer:
          type: string
        IdSubscription:
          type: integer
        Increment:
          type: integer
          description: Quantity to add (Consumption and Limitation features)
        QuantityCurrent:
          type: integer
          description: Absolute quantity to set (Consumption and Limitation features)
        IsEnabled:
          type: boolean
          description: Enabled state (OnOff features)
        DateStamp:
          type: string
          format: date-time

    # ── Quoting ─────────────────────────────────────────────────────────────

    QuoteSubscriptionRequest:
      type: object
      required:
        - ReferenceOffer
        - ReferenceCustomer
      properties:
        ReferenceOffer:
          type: string
          description: Shared identifier of the offer
        ReferenceCustomer:
          type: string
          description: Shared identifier of the customer
        ReferenceCustomerBuyer:
          type: string
          description: Shared identifier of the customer who pays. Defaults to ReferenceCustomer if omitted.
        AmountUpFront:
          type: integer
          description: Override the upfront/setup fee in cents
        AmountTrial:
          type: integer
          description: Override the trial period amount in cents
        DurationTrial:
          type: integer
          description: Override the trial period duration
        UnitTrial:
          type: string
          enum: [Day, Week, Month, Year]
          description: Override the trial period time unit
        AmountRecurrence:
          type: integer
          description: Override the recurring amount in cents
        DurationRecurrence:
          type: integer
          description: Override the recurrence duration
        UnitRecurrence:
          type: string
          enum: [Day, Week, Month, Year]
          description: Override the recurrence time unit
        Features:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionFeatureRequest"
          description: Feature overrides — same structure as subscription.override

    QuoteUsageRequest:
      type: object
      required:
        - ReferenceFeature
        - ReferenceCustomer
        - DateStamp
      properties:
        ReferenceFeature:
          type: string
          description: Shared identifier of the feature
        ReferenceCustomer:
          type: string
          description: Shared identifier of the customer
        IdSubscription:
          type: integer
          description: Subscription internal identifier — use when the customer has multiple running subscriptions
        Increment:
          type: integer
          description: Quantity to add to the current value (Consumption or Limitation features)
        QuantityCurrent:
          type: integer
          description: New absolute quantity (Limitation features only)
        IsEnabled:
          type: boolean
          description: New enabled state (OnOff features only)
        DateStamp:
          type: string
          format: date-time
          description: Timestamp of the usage event (ISO 8601)

    QuoteBalanceLineRequest:
      type: object
      required:
        - ReferenceCustomer
        - Amount
      properties:
        ReferenceCustomer:
          type: string
          description: Shared identifier of the customer
        Amount:
          type: integer
          description: Line amount in cents (negative = credit)
        Label:
          type: string
          description: Label for the balance line
        Quantity:
          type: integer
          description: Quantity to display on the invoice

    Quote:
      type: object
      properties:
        IdSubscription:
          type: integer
          nullable: true
          description: Subscription internal identifier (present for subscription and usage quotes)
        AmountTotalDue:
          type: integer
          description: Amount due immediately, in cents (includes tax)
        PricingLocalized:
          type: string
          description: Formatted amount due for display, localized in the billing language (plain text)
        DatePeriodStart:
          type: string
          format: date-time
          description: Start of the quoted billing period (ISO 8601)
        DatePeriodEnd:
          type: string
          format: date-time
          description: End of the quoted billing period (ISO 8601)
        AmountSubtotal:
          type: integer
          description: Amount before tax, in cents
        AmountTotal:
          type: integer
          description: Total amount including tax, in cents
        Details:
          type: array
          items:
            $ref: "#/components/schemas/QuoteDetail"
          description: Line-by-line breakdown of the quoted amount
        NextTerm:
          $ref: "#/components/schemas/Quote"
          description: Estimated recurring cost for the next billing period

    QuoteDetail:
      type: object
      properties:
        IdSubscription:
          type: integer
          nullable: true
          description: Subscription internal identifier (if applicable)
        IdFeature:
          type: integer
          nullable: true
          description: Feature internal identifier (usage quotes only)
        LabelLocalized:
          type: string
          description: Display label for this line, localized in the billing language
        AmountTotalDue:
          type: integer
          description: Amount due for this line, in cents
        DatePeriodStart:
          type: string
          format: date-time
          nullable: true
          description: Period start for this line (mutually exclusive with DateMove)
        DatePeriodEnd:
          type: string
          format: date-time
          nullable: true
          description: Period end for this line (mutually exclusive with DateMove)
        DateMove:
          type: string
          format: date-time
          nullable: true
          description: Value date for point-in-time lines such as upfront fees (mutually exclusive with DatePeriodStart/DatePeriodEnd)
        QuantityReported:
          type: integer
          nullable: true
          description: Quantity reported — informational, shown on invoice (usage quotes only)
        QuantityBilled:
          type: integer
          nullable: true
          description: Quantity actually billed (usage quotes only)
        AmountSubtotal:
          type: integer
          description: Line amount before tax, in cents
        AmountTotal:
          type: integer
          description: Line total amount including tax, in cents

    BalanceLineQuote:
      type: object
      properties:
        IdSegment:
          type: integer
        IdCustomer:
          type: integer
        ReferenceSegment:
          type: string
        ReferenceCustomer:
          type: string
        LabelLocalized:
          type: string
          description: Balance line label
        PricingLocalized:
          type: string
          description: Formatted total amount for display, localized in the billing language (plain text)
        Currency:
          type: string
          description: Billing currency (ISO 4217)
        AmountSubtotal:
          type: integer
          description: Amount before tax, in cents
        AmountTotal:
          type: integer
          description: Total amount including tax, in cents
        DateMove:
          type: string
          format: date-time
          description: Value date of the entry (ISO 8601)
        QuantityReported:
          type: integer
          nullable: true
          description: Quantity reported — informational
        QuantityBilled:
          type: integer
          nullable: true
          description: Quantity billed
