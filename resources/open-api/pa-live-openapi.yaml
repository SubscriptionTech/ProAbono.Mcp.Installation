                        AmountTotalDue: 26775
                        DatePeriodStart: "2025-08-10T06:21:47.71Z"
                        DatePeriodEnd: "2025-09-10T06:21:47.71Z"
                        AmountSubtotal: 21000
                        AmountTotal: 26775
                override:
                  summary: Quote for a subscription with upfront fee override
                  value:
                    AmountTotalDue: 52147
                    PricingLocalized: "€ 521.47"
                    DatePeriodStart: "2025-08-10T06:56:24.42Z"
                    DatePeriodEnd: "2025-09-10T06:56:24.42Z"
                    AmountSubtotal: 40900
                    AmountTotal: 52147
                    Details:
                      - LabelLocalized: "Up-front amount"
                        AmountTotalDue: 25372
                        DateMove: "2025-08-10T06:56:24.42Z"
                        AmountSubtotal: 19900
                        AmountTotal: 25372
                      - LabelLocalized: "Subscription amount"
                        AmountTotalDue: 26775
                        DatePeriodStart: "2025-08-10T06:56:24.42Z"
                        DatePeriodEnd: "2025-09-10T06:56:24.42Z"
                        AmountSubtotal: 21000
