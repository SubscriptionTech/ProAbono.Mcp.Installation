                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/Subscription/{IdSubscription}/Upgrade:
    post:
      tags: [Subscriptions]
      summary: Upgrade a subscription
      description: Terminates the current subscription and creates a new one on the target offer.
      parameters:
        - name: IdSubscription
          in: path
          required: true
          schema:
            type: integer
          description: Internal identifier of the subscription
        - name: ReferenceOffer
          in: query
          required: true
          schema:
            type: string
          description: Shared identifier of the target offer
        - name: BillNow
          in: query
          required: false
          schema:
            type: boolean
          description: If true, triggers billing immediately after the upgrade
        - name: Immediate
          in: query
          required: false
          schema:
            type: boolean
          description: If false, the upgrade takes effect at the end of the current term instead of immediately
        - name: IgnoreEngagement
          in: query
          required: false
          schema:
            type: boolean
          description: If true, bypasses the minimum commitment check
      responses:
        "200":
          description: New subscription object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/Subscription/{IdSubscription}/Termination:
    post:
      tags: [Subscriptions]
      summary: Terminate a subscription
      parameters:
        - name: IdSubscription
          in: path
          required: true
          schema:
            type: integer
          description: Internal identifier of the subscription
        - name: Immediate
          in: query
          required: false
          schema:
            type: boolean
          description: If true, terminates the subscription immediately; otherwise schedules termination at the end of the current term
        - name: DateTermination
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Scheduled termination date (ISO 8601). Overrides the default term-end date.
      responses:
        "200":
          description: Updated subscription object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

