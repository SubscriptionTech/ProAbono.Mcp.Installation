openapi: 3.0.3
info:
  title: ProAbono API Live
  description: >
    Customer-facing API for ProAbono. Allows integrations to manage customers,
    subscriptions, feature usage, invoices, balance lines, and quoting.
  version: v1
servers:
  - url: https://api-{idBusiness}.proabono.com
    description: Production
    variables:
      idBusiness:
        description: Business internal identifier (available in the ProAbono backoffice)
        default: "<IdBusiness>"

security:
  - basicAuth: []

tags:
  - name: Customers
    description: End-customers of the Business
  - name: Usage
    description: Feature access and consumption state
  - name: Offers
    description: Pricing plans available in a segment
  - name: Features
    description: Components of an offer (OnOff, Limitation, Consumption)
  - name: Subscriptions
    description: Links between customers and offers
  - name: Invoices
    description: Billing documents (read-only)
  - name: Quoting
    description: Estimate amounts before performing an action
  - name: Balance
    description: Individual credit and debit entries

paths:

  # ─── Customers ────────────────────────────────────────────────────────────

  /v1/Customer:
    get:
      tags: [Customers]
      summary: Retrieve a customer
      parameters:
        - name: ReferenceCustomer
          in: query
          required: true
          schema:
            type: string
          description: Shared identifier of the customer
        - name: ReferenceOffer
          in: query
          required: false
          schema:
            type: string
          description: When provided, the response Links include a hosted subscription page for that offer
      responses:
        "200":
          description: Customer object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
              example:
                Id: 233700
                IdSegment: 69
                ReferenceCustomer: "cust-42"
                ReferenceSegment: "demo-eur"
                Currency: "EUR"
                Name: "John Doe"
                Email: "john@doe.com"
                Language: "en"
                Status: "Enabled"
                ReferenceAffiliation: "janesmith"
                DateAffiliation: "2025-12-03T17:07:35.04Z"
                Metadata:
                  Gender: "Male"
                  Incomes: 150000
                  Kids: 3
                Links:
                  - rel: "insite-home"
                    href: "https://demo-eur.proabono.com/portal-auth/<crypted-query-arg>"
                  - rel: "insite-collection-offers"
                    query: "<crypted-query-arg>"
                  - rel: "insite-register"
                    query: "<crypted-query-arg>"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Customers]
      summary: Create or update a customer
      description: Upsert by ReferenceCustomer. If the reference already exists the customer is updated; otherwise a new customer is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
            example:
              ReferenceCustomer: "cust-42"
              Name: "John Doe"
              Email: "john@doe.com"
              Language: "en"
      responses:
        "200":
          description: Customer object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
              example:
                Id: 233700
                IdSegment: 69
                ReferenceCustomer: "cust-42"
                ReferenceSegment: "demo-eur"
                Currency: "EUR"
                Name: "John Doe"
                Email: "john@doe.com"
                Language: "en"
                Status: "Enabled"
                Links:
                  - rel: "insite-home"
                    href: "https://demo-eur.proabono.com/portal-auth/<crypted-query-arg>"
                  - rel: "insite-collection-offers"
                    query: "<crypted-query-arg>"
                  - rel: "insite-register"
                    query: "<crypted-query-arg>"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationErrors"

  /v1/Customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - name: ReferenceSegment
          in: query
          required: false
          schema:
            type: string
        - name: ReferenceFeature
          in: query
          required: false
          schema:
            type: string
          description: Retrieve customers having an active subscription containing this feature
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/SizePage"
      responses:
        "200":
          description: Paginated list of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
              example:
                Page: 1
                SizePage: 10
                Count: 3
                TotalItems: 3
                DateGenerated: "2025-05-10T18:33:16.28Z"
                Items:
                  - Id: 233700
                    IdSegment: 69
                    ReferenceCustomer: "cust-42"
                    ReferenceSegment: "demo-eur"
                    Currency: "EUR"
                    Name: "John Doe"
                    Email: "john@doe.com"
                    Language: "en"
                    Status: "Enabled"
                  - Id: 233701
                    IdSegment: 69
                    ReferenceCustomer: "cust-43"
                    ReferenceSegment: "demo-eur"
                    Currency: "EUR"
                    Name: "Erika Mustermann"
                    Email: "erika@mustermann.de"
                    Language: "de"
                    Status: "Enabled"
                  - Id: 233702
                    IdSegment: 69
                    ReferenceCustomer: "cust-44"
                    ReferenceSegment: "demo-eur"
                    Currency: "EUR"
                    Name: "Paul Martin"
                    Email: "paul@martin.fr"
                    Language: "fr"
                    Status: "Enabled"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/Customer/Anonymization:
    post:
      tags: [Customers]
      summary: Anonymize a customer
      description: Anonymizes the customer's personal data (email, name). Used for GDPR erasure requests.
      parameters:
        - name: ReferenceCustomer
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
              example:
                Id: 233700
                IdSegment: 69
                ReferenceCustomer: "cust-42"
                ReferenceSegment: "demo-eur"
                Currency: "EUR"
                Name: "## cleared ##"
                Language: "en"
                Status: "Enabled"
                Links:
                  - rel: "insite-home"
                    href: "https://demo-eur.proabono.com/portal-auth/<crypted-query-arg>"
                  - rel: "insite-collection-offers"
                    query: "<crypted-query-arg>"
                  - rel: "insite-register"
                    query: "<crypted-query-arg>"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/Customer/LinksRevokation:
    post:
      tags: [Customers]
      summary: Revoke encrypted portal links
      description: "Revokes all active encrypted portal links. New links are generated on the next customer retrieval. Use this endpoint when a link may have been leaked or sent to the wrong customer, as the links can lead to sensitive information."
      parameters:
        - name: ReferenceCustomer
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
              example:
                Id: 233700
                IdSegment: 69
                ReferenceCustomer: "cust-42"
                ReferenceSegment: "demo-eur"
                Currency: "EUR"
                Name: "John Doe"
                Email: "john@doe.com"
                Language: "en"
                Status: "Enabled"
                Links:
                  - rel: "insite-home"
                    href: "https://demo-eur.proabono.com/portal-auth/{New-Unique-Encrypted-URL}"
                  - rel: "insite-collection-offers"
                    query: "<crypted-query-arg>"
                  - rel: "insite-register"
                    query: "<crypted-query-arg>"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/Customer/Invalidation:
    post:
      tags: [Customers]
      summary: Invalidate a customer
      description: Replaces the customer's ReferenceCustomer with a randomly generated identifier and revokes all its portal links.
      parameters:
        - name: ReferenceCustomer
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
              example:
                Id: 233700
                IdSegment: 69
                ReferenceCustomer: "cust-8f3a2b1d"
                ReferenceSegment: "demo-eur"
                Currency: "EUR"
                Name: "John Doe"
                Email: "john@doe.com"
                Language: "en"
                Status: "Enabled"
                Links: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/Customer/Suspension:
    post:
      tags: [Customers]
      summary: Suspend a customer
      description: "Suspending a customer prevents access to the portal, hosted pages, and invoices. Use this endpoint only if a customer is fraudulent or presents a security risk, as this customer won't be able to re-subscribe again later."
      parameters:
        - name: ReferenceCustomer
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated customer object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
              example:
                Id: 233700
                IdSegment: 69
                ReferenceCustomer: "cust-42"
                ReferenceSegment: "demo-eur"
                Currency: "EUR"
                Name: "John Doe"
                Email: "john@doe.com"
                Language: "en"
                Status: "Suspended"
                Links: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── CustomerAddressBilling ──────────────────────────────────────────────

  /v1/CustomerAddressBilling:
    get:
      tags: [Customers]
      summary: Retrieve the billing address of a customer
      parameters:
        - name: ReferenceCustomer
          in: query
          required: true
          schema:
            type: string
          description: Shared identifier of the customer
      responses:
        "200":
          description: CustomerAddressBilling object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressBilling"
              example:
                Company: "John Doe LLC"
                FirstName: "John"
                LastName: "Doe"
                AddressLine1: "123 avenue des Champs Elysées"
                AddressLine2: "1st Floor"
                ZipCode: "75008"
                City: "Paris"
                Country: "FR"
                Region: "FR-75"
                Phone: "+33102030405"
                TaxInformation: "FR1234567890"
        "403":
          description: Customer not found or inaccessible
    post:
      tags: [Customers]
      summary: Update the billing address of a customer
      description: All fields are optional — only the provided fields are updated.
      parameters:
        - name: ReferenceCustomer
          in: query
          required: true
          schema:
            type: string
          description: Shared identifier of the customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressBillingRequest"
            example:
              Company: "John Doe LLC"
              FirstName: "John"
              LastName: "Doe"
              AddressLine1: "123 avenue des Champs Elysées"
              AddressLine2: "1st Floor"
              ZipCode: "75008"
              City: "Paris"
              Country: "FR"
              Region: "FR-75"
              Phone: "+33102030405"
              TaxInformation: "FR1234567890"
      responses:
        "200":
          description: Updated CustomerAddressBilling object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressBilling"
              example:
                Company: "John Doe LLC"
                FirstName: "John"
                LastName: "Doe"
                AddressLine1: "123 avenue des Champs Elysées"
                AddressLine2: "1st Floor"
                ZipCode: "75008"
                City: "Paris"
                Country: "FR"
                Region: "FR-75"
                Phone: "+33102030405"
                TaxInformation: "FR1234567890"
        "403":
          description: Customer not found or inaccessible
        "422":
          $ref: "#/components/responses/ValidationErrors"

  # ─── CustomerSettingsPayment ─────────────────────────────────────────────

  /v1/CustomerSettingsPayment:
    get:
      tags: [Customers]
      summary: Retrieve the payment settings of a customer
      parameters:
        - name: ReferenceCustomer
          in: query
          required: true
          schema:
            type: string
          description: Shared identifier of the customer
      responses:
        "200":
          description: CustomerPaymentSettings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPaymentSettings"
              example:
                TypePayment: "Card"
                ModeBilling: "Auto"
                IsGreyListed: false
                NoteInvoice: "PO.123456 - Thank you for your trust."
                DateNextBilling: "2025-08-29T20:36:53.00Z"
        "403":
          description: Customer not found or inaccessible
    post:
      tags: [Customers]
      summary: Update the payment settings of a customer
      description: "Updates the payment settings of a customer. All fields are optional — only the provided fields are updated. `TypePayment` on this endpoint can only be set to a manual payment method. Automated methods (`Card`, `DirectDebit`) are managed through the payment gateway."
      parameters:
        - name: ReferenceCustomer
          in: query
          required: true
          schema:
            type: string
          description: Shared identifier of the customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPaymentSettingsRequest"
            example:
              TypePayment: "ExternalBank"
              ModeBilling: "Auto"
              IsGreyListed: false
              NoteInvoice: "PO.123456 - Thank you for your trust."
              DateNextBilling: "2025-08-30T20:36:53.00Z"
      responses:
        "200":
          description: CustomerPaymentSettings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPaymentSettings"
              example:
                TypePayment: "ExternalBank"
                ModeBilling: "Auto"
                IsGreyListed: false
                NoteInvoice: "PO.123456 - Thank you for your trust."
                DateNextBilling: "2025-08-30T20:36:53.00Z"
        "403":
          description: Customer not found or inaccessible
        "422":
          $ref: "#/components/responses/ValidationErrors"

  # ─── Usage ────────────────────────────────────────────────────────────────

  /v1/Usages:
    get:
      tags: [Usage]
      summary: Retrieve all usages for a customer or feature
      parameters:
        - name: ReferenceCustomer
          in: query
          required: false
          schema:
            type: string
        - name: ReferenceFeature
          in: query
          required: false
          schema:
            type: string
        - name: IdSubscription
          in: query
          required: false
          schema:
            type: integer
          description: Internal identifier of the subscription — use when the customer has multiple running subscriptions
      responses:
        "200":
          description: Array of usage objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usage"
              examples:
                "by customer":
                  summary: Usages for a customer
                  value:
                    Page: 1
                    SizePage: 10
                    Count: 4
                    TotalItems: 4
                    DateGenerated: "2025-03-29T21:54:19.51Z"
                    Items:
                      - IdSegment: 69
                        IdFeature: 48896
                        IdCustomer: 233700
                        IdSubscription: 140960
                        ReferenceSegment: "demo-eur"
                        ReferenceFeature: "feat-module-a"
                        ReferenceCustomer: "cust-42"
                        TypeFeature: "OnOff"
                        IsIncluded: true
                        IsEnabled: true
                        DatePeriodStart: "2025-03-29T21:35:32.00Z"
                        DatePeriodEnd: "2025-04-29T21:35:32.00Z"
                      - IdSegment: 69
                        IdFeature: 48897
                        IdCustomer: 233700
                        IdSubscription: 140960
                        ReferenceSegment: "demo-eur"
                        ReferenceFeature: "feat-users"
                        ReferenceCustomer: "cust-42"
                        TypeFeature: "Limitation"
                        QuantityIncluded: 3
                        QuantityCurrent: 4
                        DatePeriodStart: "2025-03-29T21:35:32.00Z"
                        DatePeriodEnd: "2025-04-29T21:35:32.00Z"
                      - IdSegment: 69
                        IdFeature: 48898
                        IdCustomer: 233700
                        IdSubscription: 140960
                        ReferenceSegment: "demo-eur"
                        ReferenceFeature: "feat-module-b"
                        ReferenceCustomer: "cust-42"
                        TypeFeature: "OnOff"
                        IsIncluded: false
                        IsEnabled: false
                        DatePeriodStart: "2025-03-29T21:35:32.00Z"
                        DatePeriodEnd: "2025-04-29T21:35:32.00Z"
                      - IdSegment: 69
                        IdFeature: 48899
                        IdCustomer: 233700
                        IdSubscription: 140960
                        ReferenceSegment: "demo-eur"
                        ReferenceFeature: "feat-text-messages"
                        ReferenceCustomer: "cust-42"
                        TypeFeature: "Consumption"
                        QuantityIncluded: 0
                        QuantityCurrent: 57
                        DatePeriodStart: "2025-03-29T21:35:32.00Z"
                        DatePeriodEnd: "2025-04-29T21:35:32.00Z"
                "by feature":
                  summary: Usages for a feature
                  value:
                    Page: 1
                    SizePage: 10
                    Count: 2
                    TotalItems: 2
                    DateGenerated: "2025-03-29T22:02:45.63Z"
                    Items:
                      - IdSegment: 69
                        IdFeature: 48896
                        IdCustomer: 233700
                        IdSubscription: 140960
                        ReferenceSegment: "demo-eur"
                        ReferenceFeature: "feat-users"
                        ReferenceCustomer: "cust-42"
                        TypeFeature: "Limitation"
                        QuantityIncluded: 3
                        QuantityCurrent: 17
                        DatePeriodStart: "2025-03-29T21:35:32.00Z"
                        DatePeriodEnd: "2025-04-29T21:35:32.00Z"
                      - IdSegment: 69
                        IdFeature: 48896
                        IdCustomer: 233701
                        IdSubscription: 140961
                        ReferenceSegment: "demo-eur"
                        ReferenceFeature: "feat-users"
                        ReferenceCustomer: "cust-43"
                        TypeFeature: "Limitation"
                        QuantityIncluded: 10
                        QuantityCurrent: 10
                        DatePeriodStart: "2025-03-29T22:02:38.00Z"
                        DatePeriodEnd: "2025-04-29T22:02:38.00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Usage]
      summary: Update multiple usages
      description: Updates up to 50 usage entries in a single call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/UsageRequest"
              maxItems: 50
            example:
              - ReferenceFeature: "feat-users"
                ReferenceCustomer: "cust-42"
                QuantityCurrent: 17
                DateStamp: "2025-03-29T19:35:51.65Z"
              - ReferenceFeature: "feat-users"
                ReferenceCustomer: "cust-43"
                QuantityCurrent: 10
                DateStamp: "2025-03-29T19:35:51.65Z"
      responses:
        "200":
          description: Array of updated usage objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usage"
              example:
                - IdSegment: 69
                  IdFeature: 48896
                  IdCustomer: 233700
                  IdSubscription: 140960
                  ReferenceSegment: "demo-eur"
                  ReferenceFeature: "feat-users"
                  ReferenceCustomer: "cust-42"
                  TypeFeature: "Limitation"
                  QuantityIncluded: 3
                  QuantityCurrent: 17
                  DatePeriodStart: "2025-03-29T21:35:32.00Z"
                  DatePeriodEnd: "2025-04-29T21:35:32.00Z"
                - IdSegment: 69
                  IdFeature: 48896
                  IdCustomer: 233701
                  IdSubscription: 140961
                  ReferenceSegment: "demo-eur"
                  ReferenceFeature: "feat-users"
                  ReferenceCustomer: "cust-43"
                  TypeFeature: "Limitation"
                  QuantityIncluded: 10
                  QuantityCurrent: 10
                  DatePeriodStart: "2025-03-29T21:35:32.00Z"
                  DatePeriodEnd: "2025-04-29T21:35:32.00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationErrors"

  /v1/Usage:
    get:
      tags: [Usage]
      summary: Retrieve a single usage
      parameters:
        - name: ReferenceFeature
          in: query
          required: false
          schema:
            type: string
        - name: ReferenceCustomer
          in: query
          required: false
          schema:
            type: string
        - name: IdSubscription
          in: query
          required: false
          schema:
            type: integer
          description: Internal identifier of the subscription — use when the customer has multiple running subscriptions
      responses:
        "200":
          description: Usage object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
              examples:
                "limitation feature":
                  summary: Limitation feature
                  value:
                    IdSegment: 69
                    IdFeature: 48896
                    IdCustomer: 233700
                    IdSubscription: 140960
                    ReferenceSegment: "demo-eur"
                    ReferenceFeature: "feat-users"
                    ReferenceCustomer: "cust-42"
                    TypeFeature: "Limitation"
                    QuantityIncluded: 3
                    QuantityCurrent: 17
                    DatePeriodStart: "2025-03-29T21:35:32.00Z"
                    DatePeriodEnd: "2025-04-29T21:35:32.00Z"
                "on/off feature":
                  summary: OnOff feature
                  value:
                    IdSegment: 69
                    IdFeature: 48896
                    IdCustomer: 233700
                    IdSubscription: 140960
                    ReferenceSegment: "demo-eur"
                    ReferenceFeature: "feat-module-a"
                    ReferenceCustomer: "cust-42"
                    TypeFeature: "OnOff"
                    IsIncluded: true
                    IsEnabled: true
                    DatePeriodStart: "2025-03-29T21:35:32.00Z"
                    DatePeriodEnd: "2025-04-29T21:35:32.00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Usage]
      summary: Update a single usage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageRequest"
            examples:
              increment:
                summary: Increment a Consumption feature
                value:
                  ReferenceFeature: "feat-text-messages"
                  ReferenceCustomer: "cust-42"
                  Increment: 57
                  DateStamp: "2025-03-29T19:33:50.65Z"
              set:
                summary: Set a Limitation feature to an absolute value
                value:
                  ReferenceFeature: "feat-users"
                  ReferenceCustomer: "cust-42"
                  QuantityCurrent: 17
                  DateStamp: "2025-03-29T19:35:51.65Z"
              toggle:
                summary: Enable an OnOff feature
                value:
                  ReferenceFeature: "feat-module-b"
                  ReferenceCustomer: "cust-42"
                  IsEnabled: true
                  DateStamp: "2025-03-29T18:33:50.67Z"
      responses:
        "200":
          description: Updated usage object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
              examples:
                increment:
                  summary: Increment response (Consumption feature)
                  value:
                    IdSegment: 69
                    IdFeature: 48896
                    IdCustomer: 233700
                    IdSubscription: 140960
                    ReferenceSegment: "demo-eur"
                    ReferenceFeature: "feat-text-messages"
                    ReferenceCustomer: "cust-42"
                    TypeFeature: "Consumption"
                    QuantityIncluded: 0
                    QuantityCurrent: 57
                    DatePeriodStart: "2025-03-29T21:35:32.00Z"
                    DatePeriodEnd: "2025-04-29T21:35:32.00Z"
                set:
                  summary: Set response (Limitation feature)
                  value:
                    IdSegment: 69
                    IdFeature: 48896
                    IdCustomer: 233700
                    IdSubscription: 140960
                    ReferenceSegment: "demo-eur"
                    ReferenceFeature: "feat-users"
                    ReferenceCustomer: "cust-42"
                    TypeFeature: "Limitation"
                    QuantityIncluded: 3
                    QuantityCurrent: 17
                    DatePeriodStart: "2025-03-29T21:35:32.00Z"
                    DatePeriodEnd: "2025-04-29T21:35:32.00Z"
                toggle:
                  summary: Toggle response (OnOff feature)
                  value:
                    IdSegment: 69
                    IdFeature: 48896
                    IdCustomer: 233700
                    IdSubscription: 140960
                    ReferenceSegment: "demo-eur"
                    ReferenceFeature: "feat-module-b"
                    ReferenceCustomer: "cust-42"
                    TypeFeature: "OnOff"
                    IsIncluded: false
                    IsEnabled: true
                    DatePeriodStart: "2025-03-29T21:35:32.00Z"
                    DatePeriodEnd: "2025-04-29T21:35:32.00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationErrors"

  # ─── Offers ───────────────────────────────────────────────────────────────

  /v1/Offers:
    get:
      tags: [Offers]
      summary: List offers
      parameters:
        - name: ReferenceCustomer
          in: query
          required: false
          schema:
            type: string
          description: When provided, returns offers available for that customer
        - name: Upgrade
          in: query
          required: false
          schema:
            type: boolean
          description: When true (with ReferenceCustomer or IdSubscription), returns only upgrade options
        - name: IdSubscription
