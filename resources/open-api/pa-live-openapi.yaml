  # ─── Quoting ──────────────────────────────────────────────────────────────

  /v1/Quoting/Subscription:
    post:
      tags: [Quoting]
      summary: Quote a subscription creation or override
      description: >
        Computes the amount that would be charged if a subscription were created now, without
        creating it. Include override fields (AmountUpFront, AmountRecurrence, Features, etc.)
        to simulate an overridden subscription creation.
      parameters:
        - name: EnsureBillable
          in: query
          required: false
          schema:
            type: boolean
          description: If true, checks that the customer has valid payment information before computing. Returns 403 if not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteSubscriptionRequest"
            examples:
              create:
                summary: Quote a new subscription
                value:
                  ReferenceOffer: "offer-starter"
                  ReferenceCustomer: "cust-42"
              override:
                summary: Quote a subscription with upfront fee override
                value:
                  ReferenceOffer: "offer-starter"
                  AmountUpFront: 19900
                  ReferenceCustomer: "cust-42"
      responses:
        "200":
          description: Quote object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              examples:
                create:
                  summary: Quote for a new subscription
                  value:
                    AmountTotalDue: 26775
                    PricingLocalized: "€ 267.75"
                    DatePeriodStart: "2025-08-10T06:21:47.71Z"
                    DatePeriodEnd: "2025-09-10T06:21:47.71Z"
                    AmountSubtotal: 21000
                    AmountTotal: 26775
                    Details:
