        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Subscriptions]
      summary: Create a subscription
      description: >
        Creates a new subscription for a customer. By default the subscription is a copy of the offer
        at creation time. To override offer parameters (pricing, trial period, features, etc.),
        include the relevant override fields in the request body.
      parameters:
        - name: EnsureBillable
          in: query
          required: false
          schema:
            type: boolean
          description: Check whether the customer can be billed before creating the subscription
        - name: TryStart
          in: query
          required: false
          schema:
            type: boolean
          description: If true, attempt to start the subscription immediately after creation
        - name: BillNow
          in: query
          required: false
          schema:
            type: boolean
          description: If true, trigger billing immediately after starting the subscription
        - name: Migration
          in: query
          required: false
          schema:
            type: boolean
          description: If true, starts the subscription without billing the first period — use when migrating an already-billed subscription from another system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRequest"
            examples:
              basic:
                summary: Basic subscription
                value:
                  ReferenceCustomer: "cust-42"
                  ReferenceOffer: "offer-starter"
                  Metadata:
                    Site: "www.johndoe.com"
                    AccountingReference: "456-xyz"
                    IdPartner: 3
              "custom trial period":
                summary: "Override: custom trial period (21 days)"
                value:
                  ReferenceCustomer: "cust-42"
                  ReferenceOffer: "offer-starter"
                  DurationTrial: 21
                  UnitTrial: "Day"
              "custom upfront fee":
                summary: "Override: custom upfront fee (€100)"
                value:
                  ReferenceCustomer: "cust-42"
                  ReferenceOffer: "offer-starter"
                  AmountUpFront: 10000
              "custom period and amount":
                summary: "Override: custom period & amount (€199 quarterly)"
                value:
                  ReferenceCustomer: "cust-42"
                  ReferenceOffer: "offer-starter"
                  DurationRecurrence: 3
                  UnitRecurrence: "Month"
                  AmountRecurrence: 19900
              "custom discounts":
                summary: "Override: custom discounts (50% upfront + 30% recurring)"
                value:
                  ReferenceCustomer: "cust-42"
                  ReferenceOffer: "offer-starter"
                  Discounts:
                    - ReferenceDiscount: "50percent-upfrontfee"
                    - ReferenceDiscount: "30percent-subscriptionfee"
              "custom features":
                summary: "Override: custom features and pricing"
                value:
                  ReferenceCustomer: "cust-42"
                  ReferenceOffer: "offer-starter"
                  AmountUpFront: 150000
                  DurationRecurrence: 3
                  UnitRecurrence: "Month"
                  AmountRecurrence: 19900
                  Features:
                    - ReferenceFeature: "feat-module-a"
                      IsEnabled: true
                    - ReferenceFeature: "feat-module-b"
                      IsIncluded: false
                      IsEnabled: true
                      Steps:
                        - AmountCeiling: "3500"
                    - ReferenceFeature: "feat-module-c"
                      IsEnabled: true
                    - ReferenceFeature: "feat-users"
                      QuantityIncluded: 3
                      QuantityCurrent: 10
                    - ReferenceFeature: "feat-agents"
                      QuantityIncluded: 5
                      QuantityCurrent: 20
                      Steps:
                        - Increment: "1"
                          AmountPerIncrement: "4000"
              "scheduled start":
                summary: "Override: scheduled start in the future"
                value:
                  ReferenceCustomer: "cust-42"
                  ReferenceOffer: "offer-starter"
                  DateStart: "2098-02-14T23:59:59.65Z"
              "backdated start":
                summary: "Override: backdated start"
                value:
                  ReferenceCustomer: "cust-42"
                  ReferenceOffer: "offer-starter"
                  DateStart: "2025-02-14T08:00:00.00Z"
              migration:
                summary: "Override: migration (no first-period billing)"
                description: "Combine with the ?Migration=true query parameter."
                value:
                  ReferenceCustomer: "cust-42"
                  ReferenceOffer: "offer-starter"
                  DateStart: "2025-02-14T08:00:00.00Z"
      responses:
        "200":
          description: Subscription object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
              example:
                Id: 140960
                IdSegment: 69
                IdOffer: 64400
                IdCustomer: 233700
                IdCustomerBuyer: 233700
                ReferenceSegment: "demo-eur"
                ReferenceOffer: "offer-starter"
                ReferenceCustomer: "cust-42"
                ReferenceCustomerBuyer: "cust-42"
                Status: "Active"
                StateSubscription: "ActiveRunning"
                DateStart: "2025-02-12T10:10:44.00Z"
                DatePeriodStart: "2025-02-12T10:10:44.00Z"
                DatePeriodEnd: "2025-03-12T10:10:44.00Z"
                DateTerm: "2025-03-12T10:10:44.00Z"
                DateResetConsumption: "2025-03-12T10:10:44.00Z"
                StatusAfterTerm: "Active"
                StateSubscriptionAfterTerm: "ActiveRunning"
                IsEngaged: false
                IsCustomerBillable: false
                IsPaymentCappingReached: false
                DateNextBilling: "2025-02-12T15:34:19.00Z"
                TitleLocalized: "Premium Pro+"
                DurationTrial: 0
